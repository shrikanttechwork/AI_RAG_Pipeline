[project]
name = "ai-engg"
version = "0.1.0"
description = "RAG basics"
readme = "README.md"
authors = [
    { name = "Shrikant Mahajan", email = "" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "scikit-learn>=1.9.1",
    "langchain==1.4.3",
    "langchain-core==1.6.7",
    "langchain-community==0.4.1",
    "langchain-openai==1.7.0",
    "langchain-openrouter==0.2.9",
    "langchain-qdrant==1.1.0",
    "langchain-text-splitters==1.0.0",
    "pypdf==6.19.0",
    "pymupdf==1.28.2",
]

[project.scripts]
ai-engg = "ai_engg:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
